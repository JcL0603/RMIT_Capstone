<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jacky's Web BLE Fall Monitor</title>
    <!-- 引入 Tailwind CSS 實現現代化高對比 UI -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col justify-between font-sans">

    <!-- 頂部導航列 -->
    <header class="bg-gray-800 p-4 shadow-md text-center border-b border-gray-700">
        <h1 class="text-xl font-bold tracking-wider text-blue-400">JACKY FALL MONITOR</h1>
        <p class="text-xs text-gray-400 mt-1">Web Bluetooth (BLE) 實時遙測系統</p>
    </header>

    <!-- 主顯示區域 -->
    <main class="flex-grow flex flex-col items-center justify-center p-6 space-y-8">
        <!-- 狀態資訊 -->
        <div class="text-center">
            <span id="conn-state" class="px-4 py-1.5 rounded-full text-xs font-semibold bg-red-500/20 text-red-400 border border-red-500/30">
                未連線
            </span>
        </div>

        <!-- 醫療監護大圓盤 -->
        <div id="status-ring" class="w-64 h-64 rounded-full flex flex-col items-center justify-center border-8 border-green-500 bg-green-500/10 shadow-[0_0_50px_rgba(16,185,129,0.3)] transition-all duration-300">
            <svg id="status-icon" class="w-24 h-24 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
            </svg>
            <span id="status-text" class="text-lg font-bold text-green-500 mt-4 tracking-wide">系統安全監護中</span>
        </div>

        <!-- AVM 數據顯示框 -->
        <div class="bg-gray-800 border border-gray-700 rounded-2xl px-6 py-4 w-full max-w-xs text-center shadow-lg">
            <p class="text-xs text-gray-400 uppercase tracking-widest mb-1">實時運動指標 (AVM)</p>
            <p class="text-2xl font-mono font-bold text-blue-400" id="avm-val">9.806 <span class="text-sm text-gray-500">m/s²</span></p>
        </div>

        <!-- 控制按鈕 -->
        <button id="btn-scan" class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-bold px-8 py-3.5 rounded-full shadow-lg hover:shadow-blue-500/30 transition-all flex items-center space-x-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <span>手動搜尋手環</span>
        </button>
    </main>

    <!-- 底部版權 -->
    <footer class="text-center p-4 text-xs text-gray-500 bg-gray-950 border-t border-gray-800">
        Jacky Lin | RMIT Capstone Project 2026
    </footer>

    <!-- Web BLE 核心控制邏輯 -->
    <script>
        const targetName = "Jacky_FallMonitor";
        const serviceUuid = "0000fff0-0000-1000-8000-00805f9b34fb"; // 統一標準 128-bit UUID
        const stateCharUuid = "0000fff1-0000-1000-8000-00805f9b34fb";
        const avmCharUuid = "0000fff2-0000-1000-8000-00805f9b34fb";

        let device = null;
        let audioCtx = null;
        let smsTriggered = false;

        const connStateSpan = document.getElementById('conn-state');
        const statusRing = document.getElementById('status-ring');
        const statusIcon = document.getElementById('status-icon');
        const statusText = document.getElementById('status-text');
        const avmValText = document.getElementById('avm-val');
        const btnScan = document.getElementById('btn-scan');

        // 初始化 Web Audio API 合成器，完全免除外部 MP3 載入失敗問題
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // 程式化合成高分貝警笛聲
        let sirenInterval = null;
        function startSiren() {
            initAudio();
            if (sirenInterval) return;
            sirenInterval = setInterval(() => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }, 500);
        }

        function stopSiren() {
            if (sirenInterval) {
                clearInterval(sirenInterval);
                sirenInterval = null;
            }
        }

        // 搜尋並連接手環
        btnScan.addEventListener('click', async () => {
            initAudio(); // 用戶點擊時必須啟用 Audio Context (iOS 瀏覽器安全要求)
            try {
                connStateSpan.innerText = "正在掃描手環...";
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: targetName }],
                    optionalServices: [serviceUuid]
                });

                connStateSpan.className = "px-4 py-1.5 rounded-full text-xs font-semibold bg-yellow-500/20 text-yellow-400 border border-yellow-500/30";
                connStateSpan.innerText = "正在建立連線...";

                const server = await device.gatt.connect();
                connStateSpan.className = "px-4 py-1.5 rounded-full text-xs font-semibold bg-green-500/20 text-green-400 border border-green-500/30";
                connStateSpan.innerText = "手環連線成功 ✅";

                device.addEventListener('gattserverdisconnected', onDisconnected);

                const service = await server.getPrimaryService(serviceUuid);

                // 訂閱 FFF1 (跌倒狀態)
                const stateChar = await service.getCharacteristic(stateCharUuid);
                await stateChar.startNotifications();
                stateChar.addEventListener('characteristicvaluechanged', (e) => {
                    const val = e.target.value.getUint8(0);
                    updateSystemState(val);
                });

                // 訂閱 FFF2 (實時 AVM 浮點數波形)
                const avmChar = await service.getCharacteristic(avmCharUuid);
                await avmChar.startNotifications();
                avmChar.addEventListener('characteristicvaluechanged', (e) => {
                    const val = e.target.value;
                    // 解析 Little Endian Float32 (對齊 V12 韌體)
                    const avm = val.getFloat32(0, true);
                    avmValText.innerHTML = `${avm.toFixed(3)} <span class="text-sm text-gray-500">m/s²</span>`;
                });

            } catch (err) {
                console.error(err);
                connStateSpan.className = "px-4 py-1.5 rounded-full text-xs font-semibold bg-red-500/20 text-red-400 border border-red-500/30";
                connStateSpan.innerText = `連線失敗: ${err.message}`;
            }
        });

        function onDisconnected() {
            connStateSpan.className = "px-4 py-1.5 rounded-full text-xs font-semibold bg-red-500/20 text-red-400 border border-red-500/30";
            connStateSpan.innerText = "連線中斷 ❌";
            updateSystemState(0);
            stopSiren();
        }

        // 系統狀態控制與物理反應
        function updateSystemState(state) {
            if (state === 0) {
                // Standby 正常狀態
                statusRing.className = "w-64 h-64 rounded-full flex flex-col items-center justify-center border-8 border-green-500 bg-green-500/10 shadow-[0_0_50px_rgba(16,185,129,0.3)] transition-all duration-300";
                statusIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>`;
                statusIcon.className = "w-24 h-24 text-green-500";
                statusText.innerText = "系統安全監護中";
                statusText.className = "text-lg font-bold text-green-500 mt-4 tracking-wide";
                stopSiren();
                smsTriggered = false;
            } 
            else if (state === 1) {
                // Prefall 預警狀態
                statusRing.className = "w-64 h-64 rounded-full flex flex-col items-center justify-center border-8 border-yellow-500 bg-yellow-500/10 shadow-[0_0_50px_rgba(245,158,11,0.3)] transition-all duration-300";
                statusIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>`;
                statusIcon.className = "w-24 h-24 text-yellow-500";
                statusText.innerText = "注意：檢測到跌倒前兆！";
                statusText.className = "text-lg font-bold text-yellow-500 mt-4 tracking-wide";
                
                // 輕微單次震動 (對應 Web API)
                if (navigator.vibrate) {
                    navigator.vibrate(300);
                }
            } 
            else if (state === 2) {
                // Fall Crash 嚴重跌倒
                statusRing.className = "w-64 h-64 rounded-full flex flex-col items-center justify-center border-8 border-red-500 bg-red-500/10 shadow-[0_0_50px_rgba(239,68,68,0.5)] animate-pulse transition-all duration-300";
                statusIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>`;
                statusIcon.className = "w-24 h-24 text-red-500";
                statusText.innerText = "危險！發生嚴重跌倒！";
                statusText.className = "text-lg font-bold text-red-500 mt-4 tracking-wide";
                
                // 強烈持續震動
                if (navigator.vibrate) {
                    navigator.vibrate([500, 200, 500, 200, 500]);
                }
                
                // 響起警報聲
                startSiren();

                // 觸發高精度定位並拉起簡訊
                if (!smsTriggered) {
                    smsTriggered = true;
                    triggerSmsAlert();
                }
            }
        }

        // 定位並發送求救簡訊
        function triggerSmsAlert() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const mapUrl = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
                    const msg = `【緊急求救】Jacky跌倒監測系統檢測到使用者發生嚴重跌倒！目前GPS位置：${mapUrl}`;
                    
                    // 呼叫 iOS 簡訊接口
                    window.location.href = `sms:+85212345678&body=${encodeURIComponent(msg)}`;
                }, (err) => {
                    // 若定位失敗，發送無 GPS 的簡訊
                    window.location.href = `sms:+85212345678&body=${encodeURIComponent("【緊急求救】Jacky跌倒監測系統檢測到使用者發生嚴重跌倒！(未獲取到GPS位置)")}`;
                }, { enableHighAccuracy: true });
            }
        }
    </script>
</body>
</html>
