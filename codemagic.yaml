# ==========================================
# Jacky Fall Monitor CI/CD Build Script (Fixed v6)
# Designed for Windows 11 + iPhone 16PM Sideloading
# ==========================================
workflows:
  ios-unsigned-build:
    name: Jacky Fall Monitor - iOS Unsigned Build
    max_build_duration: 30
    instance_type: mac_mini_m1 # 對齊官方 M1 實例
    environment:
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: 1. 獲取 Flutter 相依庫
        script: |
          flutter pub get
      - name: 2. 逆轉時序注入免簽名設定並編譯
        script: |
          # 💡 Step A: 寫入主專案手動簽名與虛擬 Team ID 補丁
          cat << 'EOF' > patch_xcode.py
          import re
          path = "ios/Runner.xcodeproj/project.pbxproj"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          # 注入虛擬 DEVELOPMENT_TEAM 且強制設為 Manual 簽名模式，防止 Xcode 聯網校驗
          new_content = re.sub(r'buildSettings\s*=\s*\{', 'buildSettings = {\n\t\t\tDEVELOPMENT_TEAM = "DUMMY12345";\n\t\t\tCODE_SIGN_STYLE = Manual;', content)
          # 清除任何可能存在的 Code Sign Identity
          new_content = new_content.replace('CODE_SIGN_IDENTITY = "iPhone Developer";', 'CODE_SIGN_IDENTITY = "";')
          with open(path, "w", encoding="utf-8") as f:
              f.write(new_content)
          print("Successfully patched project.pbxproj with manual signing and dummy DEVELOPMENT_TEAM!")
          EOF

          # 💡 Step B: 寫入 CocoaPods 插件禁用簽名補丁
          cat << 'EOF' > patch_podfile.py
          import os
          path = "ios/Podfile"
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              # 在 Podfile post_install 中動態注入禁用簽名指令，防止第三方 Plugin 編譯失敗
              target_str = 'flutter_additional_ios_build_settings(target)'
              if target_str in content:
                  new_str = target_str + '\n    target.build_configurations.each do |config|\n      config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"\n      config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"\n      config.build_settings["CODE_SIGN_IDENTITY"] = ""\n      config.build_settings["DEVELOPMENT_TEAM"] = "DUMMY12345"\n    end'
                  content = content.replace(target_str, new_str)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print("Successfully patched Podfile with CocoaPods codesigning bypass!")
              else:
                  print("Warning: post_install trigger not found in Podfile")
          else:
              print("Warning: Podfile not found")
          EOF

          # 💡 Step C: 【關鍵逆轉】先執行主專案 Xcode 補丁，騙過 Flutter 預檢！
          python3 patch_xcode.py

          # 💡 Step D: 執行第一次預編譯（此時預檢 100% 通過，成功在本地逼出 ios/Podfile 檔案！）
          flutter build ios --release --no-codesign || true

          # 💡 Step E: 【關鍵補完】此時 Podfile 已安全誕生，立刻執行 Podfile 補丁！
          python3 patch_podfile.py

          # 💡 Step F: 向 Release.xcconfig 注入最高優先級的禁用簽名指令
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=" >> ios/Flutter/Release.xcconfig
          
          # 💡 Step G: 強制 CocoaPods 重新拉取我們注入完畢的 Podfile，重構 Pods.xcodeproj 專案檔
          cd ios
          pod install
          cd ..
          
          # 💡 Step H: 執行最終的實體 iOS 編譯（主專案與插件全部完美免簽，暢行無阻！）
          flutter build ios --release --no-codesign
      - name: 3. 封裝為 Sideloadly 相容的實體 .ipa 檔案
        script: |
          # 手動創建標準 iOS 安裝包 Payload 結構
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload
          cd build/ios/ipa
          zip -r jacky_fall_monitor.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa # 📥 編譯成功後，提供 .ipa 檔案下載！